[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heirloom-brain"
version = "0.0.1"
description = "Heirloom's brain. One brain, any body."
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "websockets>=13,<16",  # matches reachy-mini
]

[project.optional-dependencies]
reachy = ["reachy-mini[mujoco]==1.12.0"]  # [mujoco] is needed for the simulator
voice = ["vosk==0.3.45", "sounddevice"]     # offline speech, runs on this computer

[tool.setuptools.packages.find]
include = ["heirloom*"]
